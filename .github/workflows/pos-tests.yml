name: POS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: solar_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pdisposable-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: H2 suite
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml test
      - name: MySQL suite
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
