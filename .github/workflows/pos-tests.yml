name: POS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [h2, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: solar_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pdisposable-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: P2-04 architecture and static authorization gate (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=ModuleArchitectureTest,AuthorizationPolicyRegistryTest,AuthorizationPolicyMatrixTest,RuntimeAuthorizationEndpointInventoryTest,RepositoryTenantAccessAnalysisTest,SpringDataRepositoryAstAnalysisTest,JdbcTenantSqlAstAnalysisTest,ServiceBoundaryMethodInventoryTest' test
      - name: P2-04 architecture and static authorization gate (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=ModuleArchitectureTest,AuthorizationPolicyRegistryTest,AuthorizationPolicyMatrixTest,RuntimeAuthorizationEndpointInventoryTest,RepositoryTenantAccessAnalysisTest,SpringDataRepositoryAstAnalysisTest,JdbcTenantSqlAstAnalysisTest,ServiceBoundaryMethodInventoryTest' test
      - name: Financial tenant isolation, rollback and deletion acceptance (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#' test
      - name: Financial tenant isolation, rollback and deletion acceptance (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#' test
      - name: P1-02 tenant role template runtime (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p102ProvisionedTemplatesEnforceRuntimeScopes,P101VendorRoleLifecycleTest#templateRetriesPreserveTenantSnapshotsAndRejectEscalation,StandardRoleTemplatesTest,V50LocalDemoRoleAssignmentsTest,V54TenantRoleTemplateOriginMigrationTest' test
      - name: P1-02 tenant role template runtime (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p102ProvisionedTemplatesEnforceRuntimeScopes,P101VendorRoleLifecycleTest#templateRetriesPreserveTenantSnapshotsAndRejectEscalation,StandardRoleTemplatesTest,V54TenantRoleTemplateOriginMigrationTest' test
      - name: Clean local demo migrations (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml -Dtest=LocalDemoFlywaySeedMySqlTest test
      - name: P2-02 MySQL 8.4 migration and schema contracts
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml -Dtest=P202MysqlPersistenceIntegrationTest test
      - name: P1-01 custom role lifecycle and delegation (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=P101VendorRoleLifecycleTest,VendorRolePermissionCatalogueTest,VendorRoleControllerAuthorizationTest,VendorRoleServiceAuthorizationBoundaryTest' test
      - name: P1-01 custom role lifecycle and delegation (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=P101VendorRoleLifecycleTest,VendorRolePermissionCatalogueTest,VendorRoleControllerAuthorizationTest,VendorRoleServiceAuthorizationBoundaryTest' test
      - name: P0-03 role-only authorization and entitlements (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=MembershipServiceTest,TenantEntitlementPolicyTest,VendorRoleServiceProvisioningTest,VendorRoleServiceAuthorizationBoundaryTest' test
      - name: P0-03 role-only authorization and entitlements (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=MembershipServiceTest,TenantEntitlementPolicyTest,VendorRoleServiceProvisioningTest,VendorRoleServiceAuthorizationBoundaryTest' test
      - name: P0-02 service-boundary authorization acceptance (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=ServiceBoundaryMethodInventoryTest,BackgroundEntryPointInventoryTest,AuthorizationPolicyMatrixTest,AuthorizationPolicyRegistryTest,P004TenantIsolationTest,AuthenticationServiceTest,AuthenticationActorContextTest,IdentityProvisioningServiceTest,BranchProvisioningServiceTest,PlatformMfaTest,TenantLifecycleTest,TenantServiceDirectoryValidationTest,StockReceivingServiceTest,PosServiceBoundaryTest,CashierSalesServiceTest,SalesReportServiceTest,RefundReportServiceTest,ReportExportServiceTest,CheckoutReceiptServiceTest,DraftRecoveryServiceTest,OnlineReceiptServiceTest,OrderHistoryServiceTest,CatalogSearchServiceTest,ProductDetailServiceTest,CategoryAdminServiceTest,ProductAdminServiceTest,VendorDirectoryServiceTest,PosCatalogServiceTest,CartServiceAuthorizationBoundaryTest,CheckoutServiceAuthorizationBoundaryTest,CustomerAccessAuthorizationBoundaryTest,ReturnSaleAccessAuthorizationBoundaryTest,ReturnsExportsAuthorizationBoundaryTest,ReadOnlyServiceAuthorizationBoundaryTest,VendorRoleServiceAuthorizationBoundaryTest,BranchPolicyServiceAuthorizationBoundaryTest,DiscountPolicyServiceTest,SaleDiscountServiceTest,CatalogServicePaymentReviewAuthorizationTest,CatalogPromotionAuthorizationBoundaryTest,CustomerAssociationServiceTest,VendorCustomerServiceTest,ReceiptDocumentServiceTest,PaymentCheckoutServiceTest,PlatformAdminServiceAuthorizationTest,PlatformConfigurationServiceTest,PlatformSupportServiceTest,TenantSubscriptionServiceAuthorizationTest,PlatformAuditServiceTest,PosTest#' test
      - name: P0-02 service-boundary authorization acceptance (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=ServiceBoundaryMethodInventoryTest,BackgroundEntryPointInventoryTest,AuthorizationPolicyMatrixTest,AuthorizationPolicyRegistryTest,P004TenantIsolationTest,AuthenticationServiceTest,AuthenticationActorContextTest,IdentityProvisioningServiceTest,BranchProvisioningServiceTest,PlatformMfaTest,TenantLifecycleTest,TenantServiceDirectoryValidationTest,StockReceivingServiceTest,PosServiceBoundaryTest,CashierSalesServiceTest,SalesReportServiceTest,RefundReportServiceTest,ReportExportServiceTest,CheckoutReceiptServiceTest,DraftRecoveryServiceTest,OnlineReceiptServiceTest,OrderHistoryServiceTest,CatalogSearchServiceTest,ProductDetailServiceTest,CategoryAdminServiceTest,ProductAdminServiceTest,VendorDirectoryServiceTest,PosCatalogServiceTest,CartServiceAuthorizationBoundaryTest,CheckoutServiceAuthorizationBoundaryTest,CustomerAccessAuthorizationBoundaryTest,ReturnSaleAccessAuthorizationBoundaryTest,ReturnsExportsAuthorizationBoundaryTest,ReadOnlyServiceAuthorizationBoundaryTest,VendorRoleServiceAuthorizationBoundaryTest,BranchPolicyServiceAuthorizationBoundaryTest,DiscountPolicyServiceTest,SaleDiscountServiceTest,CatalogServicePaymentReviewAuthorizationTest,CatalogPromotionAuthorizationBoundaryTest,CustomerAssociationServiceTest,VendorCustomerServiceTest,ReceiptDocumentServiceTest,PaymentCheckoutServiceTest,PlatformAdminServiceAuthorizationTest,PlatformConfigurationServiceTest,PlatformSupportServiceTest,TenantSubscriptionServiceAuthorizationTest,PlatformAuditServiceTest,PosTest#' test
      - name: P0-06 runtime authorization matrix (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=RuntimeAuthorizationEndpointInventoryTest,RuntimeAuthorizationPersistedRoleTest,AuthorizationPolicyMatrixTest,AuthorizationPolicyRegistryTest,PermissionCatalogueContractTest,PermissionCatalogueSrsParityTest,PermissionCatalogueDatabaseParityTest' test
      - name: P0-06 runtime authorization matrix (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=RuntimeAuthorizationEndpointInventoryTest,RuntimeAuthorizationPersistedRoleTest,AuthorizationPolicyMatrixTest,AuthorizationPolicyRegistryTest' test
      - name: P0-07 explicit actor-context separation (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=AuthenticationActorContextTest,AuthorizationContextTest,AuthenticationServiceTest,IdentityProvisioningServiceTest,PosTest#p007DualCustomerVendorIdentityRequiresExplicitContextSwitchAndNeverFallsBack+p007VendorCanSwitchBackToCustomerAndDropsVendorScope+p007PlatformIdentityCannotSwitchIntoCommercialContext' test
      - name: P0-07 explicit actor-context separation (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=AuthenticationActorContextTest,AuthorizationContextTest,AuthenticationServiceTest,IdentityProvisioningServiceTest,PosTest#p007DualCustomerVendorIdentityRequiresExplicitContextSwitchAndNeverFallsBack+p007VendorCanSwitchBackToCustomerAndDropsVendorScope+p007PlatformIdentityCannotSwitchIntoCommercialContext' test
      - name: P0-06 persisted platform, vendor and accountant actors (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p006PlatformSuperAdminAndSupportUsePersistedPlatformGrantsWithoutVendorAuthority+p006AccountantCanReadAssignedFinancialReportsButCannotReceiveInventory+p006VendorAdminCannotForgeTenantScopeThroughQueryParameters' test
      - name: P0-06 persisted platform, vendor and accountant actors (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p006PlatformSuperAdminAndSupportUsePersistedPlatformGrantsWithoutVendorAuthority+p006AccountantCanReadAssignedFinancialReportsButCannotReceiveInventory+p006VendorAdminCannotForgeTenantScopeThroughQueryParameters' test
      - name: P0-06 all protected endpoints with persisted matching actors (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p006EveryApplicableLiveEndpointExecutesWithMatchingPersistedActor' test
      - name: P0-06 all protected endpoints with persisted matching actors (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p006EveryApplicableLiveEndpointExecutesWithMatchingPersistedActor' test
      - name: P0-06 vendor admin, customer ownership and POS assignment HTTP cases (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p006VendorAdminCustomRoleAndCustomerOwnedHttpResourcesAreTenantScoped+p006CashierHttpChecksSameBranchUnassignedRegisterAndForeignSession' test
      - name: P0-06 vendor admin, customer ownership and POS assignment HTTP cases (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#p006VendorAdminCustomRoleAndCustomerOwnedHttpResourcesAreTenantScoped+p006CashierHttpChecksSameBranchUnassignedRegisterAndForeignSession' test
      - name: P0-06 Platform Support grant/revoke acceptance (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PlatformSupportRuntimeAuthorizationAcceptance' test
      - name: Create isolated MySQL schema for immutable Platform Support audit acceptance
        if: matrix.database == 'mysql'
        run: mysql -h 127.0.0.1 -uroot -pdisposable-test-password -e 'CREATE DATABASE IF NOT EXISTS solar_support_acceptance'
      - name: P0-06 Platform Support grant/revoke acceptance (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_support_acceptance
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PlatformSupportRuntimeAuthorizationAcceptance' test
      - name: P0-05 POS scope, session and stock-location tests (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#,PosServiceBoundaryTest,ServiceBoundaryMethodInventoryTest,BranchProvisioningServiceTest,PosCatalogServiceTest' test
      - name: P0-05 POS scope, session and stock-location tests (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PosTest#,PosServiceBoundaryTest,ServiceBoundaryMethodInventoryTest,BranchProvisioningServiceTest,PosCatalogServiceTest' test
      - name: P0-04 focused isolation test (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml -Dtest=P004TenantIsolationTest test
      - name: P0-04 focused isolation test (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml -Dtest=P004TenantIsolationTest test
      - name: H2 suite
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml test
      - name: MySQL suite
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml test
      - name: Generate complete P0-06 endpoint and actor report
        if: always()
        run: python backend/scripts/generate-p0-06-runtime-report.py
      - name: Upload P0-06 runtime authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-06-runtime-authorization-${{ matrix.database }}
          path: |
            backend/target/surefire-reports/
            backend/target/p0-06-runtime-authorization-report.csv
            backend/target/p0-06-runtime-no-permission-http.csv
            backend/target/p0-06-runtime-actor-endpoint-http.csv
            backend/target/p0-06-runtime-authorization-summary.json
          if-no-files-found: warn
          retention-days: 30
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: P3-02 focused canonical session and permission-state tests
        run: npx vitest run src/session.test.ts src/usePermissions.test.ts src/AuthenticationBoundary.test.tsx src/PlatformBoundary.test.tsx src/SessionControls.test.tsx
      - name: P1-04 and P3-01 focused navigation/action permission regression tests
        run: npx vitest run src/Shell.test.tsx src/navigation.test.ts src/usePermissions.test.ts src/PlatformBoundary.test.tsx src/PlatformApp.test.tsx src/SessionControls.test.tsx
      - run: npm test
      - run: npm run build
      - name: Upload P2-04 frontend control inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-04-frontend-control-inventory
          path: frontend/authorization-control-inventory.generated.json
          if-no-files-found: warn
          retention-days: 30

  browser-e2e:
    name: Browser E2E (Playwright / MySQL 8.4)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DB_PASSWORD: solar-e2e-app-password
      MYSQL_ROOT_PASSWORD: solar-e2e-root-password
      SPRING_PROFILES_ACTIVE: local
      PAYMENTS_MOCK_ENABLED: "true"
      AUTH_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Playwright and accessibility runners
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.52.0 @axe-core/playwright@4.14.0
      - name: Prefer reachable HTTPS Ubuntu package mirrors
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            sudo sed -i 's#http://azure.archive.ubuntu.com#https://archive.ubuntu.com#g; s#https://azure.archive.ubuntu.com#https://archive.ubuntu.com#g' "$source_file"
          done < <(sudo grep -RIl 'azure.archive.ubuntu.com' /etc/apt 2>/dev/null || true)
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-github-actions-network-retries >/dev/null
          echo "Effective Ubuntu mirror references:"
          sudo grep -R 'azure.archive.ubuntu.com' /etc/apt || true
      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-1.52.0
      - name: Install Chromium system dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Verify Chromium installation
        working-directory: frontend
        run: |
          node -e "const fs=require('node:fs'); const {chromium}=require('@playwright/test'); const executable=chromium.executablePath(); if(!fs.existsSync(executable)) throw new Error('Chromium executable is missing: '+executable); console.log('Chromium executable ready:', executable);"
      - name: Start clean local-profile MySQL 8.4 stack
        run: docker compose -p solar-e2e up -d --build
      - name: Wait for seeded application readiness
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/auth/csrf >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 5
          done
          docker compose -p solar-e2e logs --no-color
          exit 1
      - name: Run browser authorization journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Capture application logs
        if: always()
        run: docker compose -p solar-e2e logs --no-color
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-01-playwright-browser-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop and remove disposable E2E stack
        if: always()
        run: docker compose -p solar-e2e down -v

