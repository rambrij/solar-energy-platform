name: POS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [h2, mysql]
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: solar_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pdisposable-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: P0-06 Platform Support grant/revoke acceptance (H2)
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml '-Dtest=PlatformSupportRuntimeAuthorizationAcceptance' test
      - name: Create isolated MySQL schema for immutable Platform Support audit acceptance
        if: matrix.database == 'mysql'
        run: mysql -h 127.0.0.1 -uroot -pdisposable-test-password -e 'CREATE DATABASE IF NOT EXISTS solar_support_acceptance'
      - name: P0-06 Platform Support grant/revoke acceptance (MySQL 8.4)
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_support_acceptance
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml '-Dtest=PlatformSupportRuntimeAuthorizationAcceptance' test
      - name: H2 suite
        if: matrix.database == 'h2'
        run: mvn -B -f backend/pom.xml package
      - name: MySQL suite
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/solar_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: disposable-test-password
        run: mvn -B -f backend/pom.xml package
      - name: Publish tested backend JAR for browser E2E
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ matrix.database }}
          path: backend/target/pos-2.0.0.jar
          if-no-files-found: error
          retention-days: 1
      - name: Generate complete P0-06 endpoint and actor report
        if: always()
        run: python backend/scripts/generate-p0-06-runtime-report.py
      - name: Upload P0-06 runtime authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-06-runtime-authorization-${{ matrix.database }}
          path: |
            backend/target/surefire-reports/
            backend/target/p0-06-runtime-authorization-report.csv
            backend/target/p0-06-runtime-no-permission-http.csv
            backend/target/p0-06-runtime-actor-endpoint-http.csv
            backend/target/p0-06-runtime-authorization-summary.json
          if-no-files-found: warn
          retention-days: 30
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests and verify the authorization registry
        run: npm test
      - run: npm run build
      - name: Upload P2-04 frontend control inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-04-frontend-control-inventory
          path: frontend/authorization-control-inventory.generated.json
          if-no-files-found: warn
          retention-days: 30

  browser-e2e:
    name: Browser E2E (Playwright / MySQL 8.4)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DB_PASSWORD: solar-e2e-app-password
      MYSQL_ROOT_PASSWORD: solar-e2e-root-password
      SPRING_PROFILES_ACTIVE: local
      PAYMENTS_MOCK_ENABLED: "true"
      AUTH_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - name: Download the MySQL-tested backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar-mysql
          path: backend/target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Playwright and accessibility runners
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.52.0 @axe-core/playwright@4.14.0
      - name: Prefer reachable HTTPS Ubuntu package mirrors
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04 hosted runners expose their main archive through
          # /etc/apt/apt-mirrors.txt. Its hostname is runner-region-specific
          # (for example us-east-2.ec2.archive.ubuntu.com), so replacing only
          # azure.archive.ubuntu.com leaves the active HTTP mirror unchanged.
          mirror_pattern='https?://[^/[:space:]]*archive\.ubuntu\.com/ubuntu'
          while IFS= read -r source_file; do
            sudo sed -i -E 's#https?://[^/[:space:]]*archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source_file"
          done < <(sudo grep -RIlE "$mirror_pattern" /etc/apt 2>/dev/null || true)

          echo "Effective Ubuntu mirror list:"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo cat /etc/apt/apt-mirrors.txt
          fi
          if sudo grep -RIE 'https?://[^/[:space:]]*\.ec2\.archive\.ubuntu\.com/ubuntu' /etc/apt 2>/dev/null; then
            echo "A runner-specific EC2 Ubuntu archive mirror remains configured." >&2
            exit 1
          fi

          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-github-actions-network-retries >/dev/null
      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-1.52.0
      - name: Install Chromium system dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Verify Chromium installation
        working-directory: frontend
        run: |
          node -e "const fs=require('node:fs'); const {chromium}=require('@playwright/test'); const executable=chromium.executablePath(); if(!fs.existsSync(executable)) throw new Error('Chromium executable is missing: '+executable); console.log('Chromium executable ready:', executable);"
      - name: Start clean local-profile MySQL 8.4 stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p solar-e2e up -d --build
      - name: Wait for seeded application readiness
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/auth/csrf >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p solar-e2e logs --no-color
          exit 1
      - name: Run browser authorization journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Capture application logs
        if: always()
        run: docker compose -p solar-e2e logs --no-color
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-01-playwright-browser-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop and remove disposable E2E stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p solar-e2e down -v

