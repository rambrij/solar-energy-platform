spring:
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/solar}
    username: ${DB_USER:solar}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
checkout:
  reservation-ttl-seconds: 600
  cleanup-enabled: true
  cleanup-delay-ms: 60000
payments:
  mock-enabled: ${PAYMENTS_MOCK_ENABLED:false}
