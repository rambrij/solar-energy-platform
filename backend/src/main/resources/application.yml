spring:
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/solar}
    username: ${DB_USER:solar}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
checkout:
  reservation-ttl-seconds: 600
  cleanup-enabled: true
  cleanup-delay-ms: 60000
payments:
  mock-enabled: ${PAYMENTS_MOCK_ENABLED:false}
subscriptions:
  mock:
    enabled: ${SUBSCRIPTIONS_MOCK_BILLING_ENABLED:false}
    outcome: ${SUBSCRIPTIONS_MOCK_BILLING_OUTCOME:}
    max-attempts: ${SUBSCRIPTIONS_MOCK_BILLING_MAX_ATTEMPTS:0}
    retry-seconds: ${SUBSCRIPTIONS_MOCK_BILLING_RETRY_SECONDS:0}
auth:
  jwt-secret: ${AUTH_JWT_SECRET:}
app:
  rate-limit:
    redis-enabled: ${REDIS_RATE_LIMIT_ENABLED:false}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    bucket: ${OBJECT_STORAGE_BUCKET:saumya-assets}
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:noreply@somya.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
