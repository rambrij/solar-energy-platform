services:
  mysql:
    image: mysql:8.4
    # Allow the least-privilege application account to install schema triggers
    # while binary logging is enabled (required by the V1 audit triggers).
    # Keep this relaxed setting scoped to this local Compose database only.
    command: ["mysqld", "--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_DATABASE: solar
      MYSQL_USER: solar
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saumya-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-saumya-local-secret-change-me}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      PAYMENTS_MOCK_ENABLED: ${PAYMENTS_MOCK_ENABLED:-false}
      SUBSCRIPTIONS_MOCK_BILLING_ENABLED: ${SUBSCRIPTIONS_MOCK_BILLING_ENABLED:-false}
      SUBSCRIPTIONS_MOCK_BILLING_OUTCOME: ${SUBSCRIPTIONS_MOCK_BILLING_OUTCOME:-}
      SUBSCRIPTIONS_MOCK_BILLING_MAX_ATTEMPTS: ${SUBSCRIPTIONS_MOCK_BILLING_MAX_ATTEMPTS:-0}
      SUBSCRIPTIONS_MOCK_BILLING_RETRY_SECONDS: ${SUBSCRIPTIONS_MOCK_BILLING_RETRY_SECONDS:-0}
      MAILPIT_HOST: mailpit
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-saumya-local}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-saumya-local-secret-change-me}
      OBJECT_STORAGE_BUCKET: saumya-assets
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DB_URL: jdbc:mysql://mysql:3306/solar
      DB_USER: solar
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
volumes:
  mysql-data:
  redis-data:
  minio-data:
